label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}

.warn{background:var(--warn);color:var(--warnt);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:12px 0}

.ban{border-radius:16px;padding:26px;margin-bottom:18px;color:#fff;background:var(--pri)}

.chip:hover{background:#fff;color:#1b2a8f;transform:translateY(-2px)}.chip:focus-visible{outline:2px solid #fff;outline-offset:2px}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.sw a{padding:6px 14px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute);transition:.2s}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stat{border-left:4px solid var(--teal)}.stat b{color:var(--pri)}.pill.ok{background:#dff3e9;color:var(--ok)}.toast.err{background:var(--err)}.fe{color:var(--err);font-size:12.5px;margin-top:4px}
.tl{list-style:none;padding:0;margin:8px 0 0}.tl li{border-left:2px solid var(--line);padding:0 0 12px 14px;position:relative}.tl li:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--teal)}.tl small{color:var(--mute)}
.chk{display:flex;gap:8px;font-weight:500;align-items:flex-start}.chk input{width:auto;margin-top:4px}

<section class="s" id="services"><div class="w"><h2>Our services</h2><p class="sub">Whether you need an educational document collected, a property inspected, or an important task handled locally, Jugaro connects you with reliable on-ground assistance in Pakistan. Official approvals, processing times and institutional decisions remain under the control of the relevant authorities.</p><div class="g g3">${SV.map(s=>`<div class="c">${ic(s[1])}<h3>${s[0]}</h3><p>${s[2]}</p><button class="btn s" style="margin-top:12px" data-go="request" data-cat="${s[0]}">Request Service</button></div>`).join('')}</div></div></section>
<section class="s" id="how"><div class="w"><h2>How it works</h2><p class="sub">Eight steps from request to confirmed completion.</p><div class="g g4">${['Submit a Request','Jugaro Reviews Your Request','Receive an Itemized Quotation','Approve the Quotation','A Representative Is Assigned','Track Progress','Receive Evidence and Reports','Confirm Completion'].map((t,i)=>`<div class="c step"><b>${i+1}</b><h3>${t}</h3></div>`).join('')}</div></div></section>
<section class="s" id="cities"><div class="w"><h2>Cities we serve</h2><p class="sub">${PILOT} is our planned pilot city. The other major cities are planned expansion and are not yet available.</p><div class="g g4">${CITIES.map((c,i)=>`<div class="c"><h3>${c}</h3><span class="pill ${i?'g':''}">${i?'Planned expansion':'Planned pilot city'}</span></div>`).join('')}</div></div></section>
<section class="s"><div class="w"><h2>Our proposed standards</h2><div class="g g4" style="margin-top:18px">${[['Transparent Pricing','Designed to show service, official, courier and other costs separately.'],['Documented Task Progress','Designed to record every status change with a timestamp.'],['Representative Accountability','Proposed onboarding and review steps. No verification process exists yet.'],['Customer Authorization','Tasks proceed only with the authorization the law requires.'],['Secure Document Handling','Proposed access limits and retention rules. Not implemented in this prototype.'],['Evidence-Based Completion','Designed to attach receipts and photos before a task is completed.']].map(x=>`<div class="c"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div></section>
<section class="s"><div class="w"><div class="cta"><h2>Your family, documents, and responsibilities in Pakistan — handled with care.</h2><button class="btn t" data-go="request">Get Started</button></div></div></section>`;
P.pricing=()=>`<section class="s"><div class="w"><h2>Pricing and quotations</h2><p class="sub">Every quote splits Jugaro’s fee from costs charged by others.</p>
<div class="g g4">${[['Jugaro Service Fee','Our charge for coordination and reporting.'],['Official Fee','Paid to the government body or institution. Never shown as our charge.'],['Courier and Delivery','Actual delivery costs.'],['Other Approved Costs','Third-party costs you approve first.']].map(x=>`<div class="c"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>
<div class="c tw" style="margin-top:16px"><h3>Illustrative estimates (demo only)</h3><table><tr><th>Task</th><th>Service fee</th></tr>${[['University follow-up','USD 25–50'],['Educational document collection','USD 30–60'],['Verification coordination','USD 40–80'],['Attestation assistance','USD 40–100'],['Property inspection','USD 30–70'],['Multi-step custom request','Custom quotation']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table></div>
<div class="c" style="margin-top:16px"><h3>Sample quotation</h3><p><i>Illustrative quotation, not a real offer.</i></p><table><tr><td>Jugaro service fee</td><td>USD 40</td></tr><tr><td>Official institutional fee (set by the institution)</td><td>PKR 2,000</td></tr><tr><td>Courier charges</td><td>PKR 3,000</td></tr><tr><td>Other approved expenses</td><td>PKR 0</td></tr><tr><th>Estimated total</th><th>USD 57.86</th></tr></table><p style="font-size:12.5px">PKR 5,000 converted at a demo rate of USD 1 = PKR 280 (20 Nov 2026, illustrative). Final amounts follow the rate stated in each quotation.</p></div><div class="warn">Final pricing depends on location, task complexity, official requirements, urgency, and third-party costs. Official fees are disclosed separately and are never represented as Jugaro service charges.</div>
<div class="g g2"><div class="c"><h3>What you can count on</h3><ul><li>You approve every quotation before work starts.</li><li>No hidden fees.</li><li>Cancellation and refund terms are shown before you approve.</li></ul></div><div class="c"><h3>What we cannot promise</h3><p>We do not guarantee that any university, government department or embassy will approve a request.</p></div></div></div></section>`;
P.trust=()=>`<section class="s"><div class="w"><h2>Trust, safety and privacy</h2><p class="sub">Jugaro is a concept prototype. These are our proposed standards, not features that exist today.</p><div class="g g2">
<div class="c"><h3>What Jugaro will never do</h3><ul><li>Bribery, unofficial payments or speed money</li><li>Forgery or document falsification</li><li>Impersonation or unauthorized access to accounts</li><li>Bypassing official procedures</li><li>Misrepresenting a representative’s authority</li></ul></div>
<div class="c"><h3>What you should know</h3><ul><li>Some procedures need your personal appearance or biometrics.</li><li>Some tasks need a Power of Attorney or written authorization.</li><li>We cannot guarantee approvals, university decisions or processing times.</li><li>Official fees are listed separately from our service fee.</li><li>Extra expenses need your approval first.</li></ul></div>
<div class="c" id="privacy"><h3>Proposed privacy principles</h3><ul><li>Your consent before sharing details with a representative</li><li>Restricted access to documents and secure storage</li><li>Limited retention and deletion on request</li><li>Confidentiality for identity and educational documents</li></ul><p>This static prototype has no server, encryption or secure storage.</p></div>
<div class="c" id="refund"><h3>Refund policy (draft)</h3><p>If a task cannot lawfully or practically be completed, you would receive an explanation and a refund under the disclosed policy, with approved third-party costs explained.</p></div>
<div class="c" id="terms"><h3>Terms</h3><p>Draft terms would be finalized with legal counsel before any launch.</p></div>
<div class="c" id="contact"><h3>Contact</h3><p>Placeholder only: no working email or phone number exists yet.</p></div></div></div></section>`;
const FS=[['cat','Service category'],['task','Task details'],['docs','Supporting documents'],['contact','Contact information'],['review','Review and submit']];
const E=(...a)=>Object.assign({},...a.map(([c,k,m])=>c?{[k]:m}:{}));
const VAL=[d=>E([!d.cat,'cat','Choose a service category.']),
d=>E([!(d.title||'').trim(),'title','Enter a task title.'],[(d.task||'').trim().length<10,'task','Describe the task (at least 10 characters).'],[d.due&&d.due<new Date().toISOString().slice(0,10),'due','Choose today or a later date.']),
()=>E([(S.wiz.ferr||[]).length>0,'files','Remove invalid files before continuing.']),
d=>E([!(d.name||'').trim(),'name','Enter your full name.'],[!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email||''),'email','Enter a valid email address.'],[!(d.country||'').trim(),'country','Enter your country.'],[!/^\+\d{1,4}$/.test(d.code||''),'code','Use a format like +44.'],[!/^\d{6,14}$/.test((d.phone||'').replace(/[\s-]/g,'')),'phone','Enter 6 to 14 digits.']),
d=>E(...['c1','c2','c3','c4'].map(k=>[!d[k],k,'This confirmation is required.']))];
P.request=()=>{const w=S.wiz,d=w.d,v=k=>esc(d[k]),e=k=>w.err&&w.err[k]?`<div class="fe" role="alert">${w.err[k]}</div>`:'',opts=(a,k)=>a.map(c=>`<option ${d[k]==c?'selected':''}>${c}</option>`).join(''),fld=(k,l,x='')=>`<label for="k_${k}">${l}</label><input id="k_${k}" data-k="${k}" value="${v(k)}" ${x}>${e(k)}`;let b='';
if(S.done)return`<section class="s"><div class="w" style="max-width:620px"><div class="c" style="text-align:center"><h2>Request submitted (demo)</h2><p class="sub" style="margin:8px auto">Your demo request ID is <b>${S.done}</b>. In a real service our operations team would review it and send an itemized quotation. This request exists only in this browser.</p><button class="btn" data-go="customer">View in dashboard</button></div></div></section>`;
if(w.step==0)b=`<div class="g g2">${SV.map(s=>`<div class="c opt ${d.cat==s[0]?'on':''}" data-act="cat" data-v="${s[0]}">${ic(s[1])}<h3>${s[0]}</h3></div>`).join('')}</div>${e('cat')}`;
if(w.step==1)b=`${fld('title','Task title')}<label for="k_task">Detailed description</label><textarea id="k_task" data-k="task" rows="4">${v('task')}</textarea>${e('task')}${fld('inst','Institution or organization (if applicable)')}<label for="k_city">City in Pakistan</label><select id="k_city" data-k="city">${opts(CITIES,'city')}</select><p style="font-size:12.5px;color:var(--mute);margin:4px 0 0">${PILOT} is the planned pilot city. Other cities are expansion examples. No representatives are operating yet.</p>${fld('due','Preferred completion date','type="date" min="'+new Date().toISOString().slice(0,10)+'"')}<label for="k_urg">Urgency</label><select id="k_urg" data-k="urg">${opts(['Standard','Urgent','Flexible'],'urg')}</select>`;
if(w.step==2)b=`<div class="warn">Upload only what the task needs. Files you select stay in your browser: this prototype does not upload or store them on any server. Some tasks need a signed authorization letter or your personal appearance.</div><label for="k_files">Supporting documents (PDF, JPG or PNG, up to 5 files, 5 MB each)</label><input id="k_files" type="file" multiple accept=".pdf,.jpg,.jpeg,.png" data-act="files">${(w.files||[]).map(f=>`<span class="pill ok" style="margin:6px 6px 0 0">${esc(f.n)} · ${f.s} KB</span>`).join('')}${(w.ferr||[]).map(m=>`<div class="fe">${esc(m)}</div>`).join('')}${e('files')}${fld('ref','Reference numbers (if any)')}`;
if(w.step==3)b=`${fld('name','Full name')}${fld('email','Email address','type="email"')}${fld('country','Country of residence')}<div class="row"><div style="width:110px">${fld('code','Country code','placeholder="+44"')}</div><div style="flex:1;min-width:160px">${fld('phone','Phone number','inputmode="tel"')}</div></div><label for="k_method">Preferred contact method</label><select id="k_method" data-k="method">${opts(['WhatsApp','Email','Phone call'],'method')}</select>`;
if(w.step==4)b=`<table>${[['Category',d.cat],['Task',d.title+': '+(d.task||'')],['Location',(d.inst||'')+' '+(d.city||PILOT)],['Preferred date',d.due],['Urgency',d.urg||'Standard'],['Files',(w.files||[]).map(f=>f.n).join(', ')||'None'],['Contact',[d.name,d.email,d.country,(d.code||'')+' '+(d.phone||''),d.method||'WhatsApp'].join(' · ')]].map(x=>`<tr><th>${x[0]}</th><td style="white-space:normal">${esc(x[1])||'—'}</td></tr>`).join('')}</table><div style="margin-top:12px">${[['c1','The information I provided is accurate.'],['c2','I authorize the requested assistance where legally applicable.'],['c3','I understand official processing and approval remain subject to the relevant authority.'],['c4','I agree to the privacy and service terms (draft, prototype).']].map(c=>`<label class="chk"><input type="checkbox" data-k="${c[0]}" ${d[c[0]]?'checked':''}>${c[1]}</label>${e(c[0])}`).join('')}</div>`;
return`<section class="s"><div class="w" style="max-width:680px"><h2>Request a service</h2><p class="sub">Step ${w.step+1} of 5: ${FS[w.step][1]}</p><div class="c">${b}<div class="row" style="margin-top:18px;justify-content:space-between"><button class="btn o" data-act="back" ${w.step?'':'disabled'}>Back</button><button class="btn" data-act="${w.step==4?'submit':'next'}">${w.step==4?'Submit Request':'Continue'}</button></div></div></div></section>`};
const SWN={customer:'Customer',rep:'Ground Team',admin:'Operations'};
const chips=(a,f)=>`<div class="row">${a.map(f).join('')}</div>`;
const BAN={customer:()=>`<div class="ban"><h1>Everything in Pakistan, <b>one dashboard</b></h1><p>What do you need done? Pick a path and we’ll start your request.</p>${chips(SV,s=>`<button class="chip" data-go="request" data-cat="${s[0]}">${s[0]}</button>`)}</div>`,
rep:()=>`<div class="ban"><h1>Today’s <b>mission</b> on the ground</h1><p>Jump straight to what needs you.</p>${chips(['My Assigned Tasks','Available Tasks','Upload Evidence','Earnings'],t=>`<button class="chip" data-tab="${t}">${t}</button>`)}</div>`,
admin:()=>`<div class="ban"><h1>Run the ground team <b>from one place</b></h1><p>Open the queue, check your team, or review the numbers.</p>${chips(['All Requests','Representatives','Reports & Analytics','Disputes & Refunds'],t=>`<button class="chip" data-tab="${t}">${t}</button>`)}</div>`};
function anim(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('[data-n]').forEach(b=>{const q=b.dataset.n,n=parseInt(q),t0=performance.now();if(isNaN(n))return;(function f(t){const p=Math.min(1,(t-t0)/700);b.textContent=String(Math.round(n*p)).padStart(q.length,'0');if(p<1)requestAnimationFrame(f)})(t0)})}
function shell(role,title,tabs,body){const ban=!S.sel&&S.tab[role]==tabs[0]?BAN[role]():'';const sw=`<div class="sw">${Object.keys(SWN).map(k=>`<a data-go="${k}" tabindex="0" class="${k==role?'on':''}">${SWN[k]}</a>`).join('')}</div>`;return`<div class="dash"><aside class="side"><h4>${title}</h4>${tabs.map(t=>`<a data-tab="${t}" class="${S.tab[role]==t?'on':''}" tabindex="0">${t}</a>`).join('')}</aside><div class="main">${sw}${ban}${body}</div></div>`}
const stats=a=>`<div class="g g4">${a.map(x=>`<div class="c stat"><b data-n="${x[1]}">${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div><p style="font-size:12px;color:var(--mute)">DEMO DATA</p>`;
const rtable=(rs,cols)=>`<div class="c tw"><table><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${rs.map(r=>`<tr class="k" data-open="${r.id}">${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')||'<tr><td>No matching requests.</td></tr>'}</table></div>`;
const sp=r=>`<span class="pill ${pc(r.idx)}">${stat(r)}</span>`;
const CT=['Overview','My Requests','Create New Request','Quotations','Documents','Payments','Notifications','Support','Profile & Settings'];
function detail(r,role){const c=role=='customer';return`<button class="btn o s" data-act="closeSel">Back</button><h2 style="margin-top:12px">${r.id} · ${r.svc}</h2><div style="margin:8px 0">${sp(r)}</div><div class="c">${tracker(r.idx)}</div>
<div class="g g2" style="margin-top:16px"><div class="c"><h3>Task</h3><p>${r.desc}</p><p style="margin-top:8px">Category: ${r.svc}<br>City: ${r.city} · ${r.loc}<br>Representative: ${r.rep||'Not assigned yet'}<br>Estimated completion: ${r.idx>=7?'Done':dueLbl(r)+', illustrative'}</p></div>
<div class="c"><h3>Quotation</h3><p><i>Illustrative quotation, not a real offer.</i></p><table><tr><td>Jugaro service fee</td><td>USD ${r.amt}</td></tr><tr><td>Official fee (set by the institution)</td><td>PKR ${(r.off*FX).toLocaleString()}</td></tr><tr><td>Courier and transport</td><td>PKR ${(r.cour*FX).toLocaleString()}</td></tr><tr><td>Other approved expenses</td><td>PKR 0</td></tr><tr><th>Estimated total</th><th>USD ${tot(r)}</th></tr></table><p style="font-size:12px">PKR converted at demo rate USD 1 = PKR ${FX} (20 Nov 2026, illustrative).</p><p>Quotation: <span class="pill ${r.qs=='Approved'?'ok':'p'}">${r.qs}</span> Payment: <span class="pill g">${r.pay}</span></p><p style="font-size:12px">Approving a quotation does not record a payment. No payments are processed in this prototype.</p>${c&&r.idx==2?`<div class="row" style="margin-top:10px"><button class="btn t s" data-act="approveQ" data-v="${r.id}">Approve Quotation</button><button class="btn o s" data-act="revQ" data-v="${r.id}">Request Revision</button><button class="btn o s" data-act="rejQ" data-v="${r.id}">Reject Quotation</button></div>`:''}</div></div>
<div class="c" style="margin-top:16px"><h3>Activity timeline</h3><ul class="tl">${r.tl.map(t=>`<li><b>${t.ev}</b><br><small>${t.d} · ${t.who}</small></li>`).join('')}</ul></div>${r.idx>=6?`<div class="c" style="margin-top:16px"><h3>Illustrative Demo Report</h3><p>Visit: ${r.date}, 11:30 AM · Representative: ${r.rep}<br>Work done: Task carried out as authorized; documents handled per instructions.</p><div class="row" style="margin:10px 0">${(r.ev||[]).map(x=>`<span class="pill g">${x}</span>`).join('')}</div>${c&&r.idx==6&&r.sub?`<button class="btn t" data-act="confirm" data-v="${r.id}">Confirm completion (simulated customer action)</button>`:r.idx==7?'<span class="pill ok">Customer confirmed</span>':`<span class="pill p">${r.sub?'Submitted for customer review':'Awaiting representative submission'}</span>`}</div>`:''}
${!c?`<div class="c" style="margin-top:16px"><h3>Operations actions</h3><div class="g g4"><div><label>Assign representative</label><select data-adm="rep" data-v="${r.id}"><option value="">Choose</option>${REPS.map(p=>`<option ${r.rep==p[0]?'selected':''}>${p[0]}</option>`).join('')}</select></div><div><label>Quotation, service fee (USD)</label><div class="row"><input type="number" id="qa" value="${r.amt}" style="width:90px"><button class="btn s" data-act="quote" data-v="${r.id}">Send</button></div></div><div><label>Status</label>${r.idx==0?`<button class="btn s" data-act="review" data-v="${r.id}">Mark under review</button>`:`<span class="pill">${stat(r)}</span>`}<p style="font-size:12px">Later steps follow the workflow: quotation, customer approval, representative actions, then review.</p><details style="margin-top:8px"><summary>Exceptional admin override</summary><label>New status</label><select id="ovs">${ST.map((s,i)=>`<option value="${i}">${s}</option>`).join('')}</select><label>Reason (required, recorded in history)</label><input id="ovr"><button class="btn o s" style="margin-top:8px" data-act="override" data-v="${r.id}">Apply override</button></details></div><div><label>Completion and refunds</label><div class="row"><button class="btn s" data-act="appr" data-v="${r.id}">Approve completion</button><button class="btn o s" data-act="refund" data-v="${r.id}">Refund</button></div></div></div></div>`:''}`}
P.customer=()=>{const t=S.tab.customer,mine=S.reqs.filter(r=>r.mine);let b='';
if(S.sel)b=detail(R(S.sel),'customer');
else if(t=='Overview')b=`<h2>Welcome back, Ayesha</h2><p class="sub">Demo customer account. Requests outside ${PILOT} are illustrative expansion examples, not operational orders.</p>${stats(cs(mine))}<h3 style="margin:18px 0 10px">Recent requests</h3>${rtable(mine,[['Request ID',r=>r.id],['Service',r=>r.svc],['City',cty],['Status',sp]])}<h3 style="margin:18px 0 10px">Recent activity and notifications</h3>${S.notes.slice(0,4).map(n=>`<div class="c" style="margin-bottom:8px">${n}</div>`).join('')}`;
else if(t=='My Requests')b=`<h2>My requests</h2>${fbar()}${rtable(flt(S.reqs.filter(r=>r.mine)),[['ID',r=>r.id],['Service',r=>r.svc],['City',cty],['Status',sp],['Total',r=>'USD '+tot(r)]])}`;
else if(t=='Quotations')b=`<h2>Quotations</h2><br>${rtable(mine.filter(r=>r.amt),[['ID',r=>r.id],['Service',r=>r.svc],['Total',r=>'USD '+tot(r)],['Status',sp]])}<p class="sub" style="margin-top:10px">Open a request to approve its quotation.</p>`;
else if(t=='Payments')b=`<h2>Payments</h2><br>${rtable(mine,[['ID',r=>r.id],['Total',r=>'USD '+tot(r)],['Payment',r=>r.pay]])}<p class="sub" style="margin-top:10px">No real payments are processed in this prototype.</p>`;

const RT=['My Assigned Tasks','Available Tasks','Task History','Upload Evidence','Earnings','Profile','Verification Status'];

else if(t=='Task History')b=`<h2>Task history</h2><br>${rtable(mine.filter(r=>r.idx==7),[['ID',r=>r.id],['Service',r=>r.svc],['City',cty]])}`;
else if(t=='Upload Evidence')b=`<h2>Upload evidence</h2><div class="warn">Upload photographs and documents only with appropriate authorization and consent.</div>${['Visit photographs','Receipts','Document collection confirmation'].map((x,i)=>`<div class="up" data-act="up2">${x} (placeholder, click to attach)</div>`).join('')}<label>Completion notes</label><textarea rows="3"></textarea><button class="btn" style="margin-top:12px" data-act="up2">Save notes</button>`;

else b=`<h2>${t}</h2><div class="c" style="margin-top:14px"><h3>${ME}</h3><p>City: ${PILOT}<br>Demo verification status: Pending (no real verification process exists yet)<br>Areas of service: Universities, boards, property visits<br>Customer rating: Placeholder</p></div>`;
return shell('rep','Ground Team',RT,b)};
const AT=['Overview','All Requests','Customers','Representatives','Quotations','Payments','Service Categories','City Management','Disputes & Refunds','Reports & Analytics','Settings'];
const bars=(t,d)=>{const m=Math.max(...d.map(x=>x[1]));return`<div class="c"><h3>${t}</h3>${d.map(x=>`<div class="bar"><span>${x[0]}</span><i style="width:${x[1]/m*55}%"></i><em>${x[1]}</em></div>`).join('')}<p style="font-size:12px">Illustrative demo data</p></div>`};
P.admin=()=>{const t=S.tab.admin;let b='';
const list=()=>flt(S.reqs);
if(S.sel)b=detail(R(S.sel),'admin');
else if(t=='Overview')b=`<h2>Operations overview</h2><br>${stats([['Total Customers',new Set(S.reqs.map(r=>r.cust)).size],['Total Representatives',REPS.length],['Total Requests',S.reqs.length],['Active Requests',S.reqs.filter(r=>r.idx<7).length],['Completed Requests',S.reqs.filter(r=>r.idx==7).length],['Pending Quotations',S.reqs.filter(pendQ).length],['Pending Reviews',S.reqs.filter(r=>r.idx==6&&r.sub).length],['Disputes',S.reqs.filter(r=>r.pay=='Refund workflow started').length],['Illustrative Revenue (demo)','USD '+S.reqs.filter(r=>r.idx==7).reduce((a,r)=>a+r.amt,0)]])}<p class="sub">Pending quotations: ${cnt('Not prepared')} to prepare, ${cnt('Awaiting your decision')} awaiting customer decision, ${cnt('Revision requested')} revision requested.</p>`;
else if(t=='All Requests')b=`<h2>All requests</h2><div class="row" style="margin:12px 0"><input placeholder="Search by ID, customer, service or city" data-act="q" value="${S.q}" style="max-width:340px"><select data-act="f" style="max-width:220px"><option>All</option>${ST.map(s=>`<option ${S.f==s?'selected':''}>${s}</option>`).join('')}</select></div><div id="at">${rtable(list(),[['ID',r=>r.id],['Customer',r=>r.cust],['Service',r=>r.svc],['City',cty],['Rep',r=>r.rep||'—'],['Status',sp],['Quote',r=>r.amt?'USD '+tot(r):'—'],['Submitted',r=>r.date]])}</div>`;
else if(t=='Representatives')b=`<h2>Representatives</h2><br><div class="c tw"><table><tr><th>Name</th><th>City</th><th>Verification</th><th>Assigned</th><th>Completed</th><th>Rating</th></tr>${REPS.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}${p[1]==PILOT?'':' (expansion example)'}</td><td>${p[2]}</td><td>${S.reqs.filter(r=>r.rep==p[0]&&r.idx<7).length}</td><td>${S.reqs.filter(r=>r.rep==p[0]&&r.idx==7).length}</td><td>Placeholder</td></tr>`).join('')}</table></div>`;
else if(t=='Reports & Analytics')b=`<h2>Analytics</h2><br><div class="g g2">${bars('Requests by category',grp(catOf))}${bars('Requests by city',grp(r=>r.city))}${bars('Requests by status',grp(stat))}${bars('Completed vs open',[['Completed',S.reqs.filter(r=>r.idx==7).length],['Open',S.reqs.filter(r=>r.idx<7).length]])}</div>`;
else b=`<h2>${t}</h2><div class="c" style="margin-top:14px"><span class="pill p">Planned feature · not implemented</span><p>Coming Soon placeholder. This would need a backend before it could work.</p></div>`;
return shell('admin','Operations',AT,b)};
function route(){const h=(location.hash||'#home').slice(1);const k=P[h]?h:'home';app.innerHTML=P[k]();foot();anim();save();document.title='Jugaro.com – '+k}
function go(k,sec){S.sel=null;if(k!='request')S.done=null;if(location.hash=='#'+k)route();else location.hash=k;setTimeout(()=>{if(sec){const e=document.getElementById(sec);e&&e.scrollIntoView()}else scrollTo(0,0)},30)}
function collect(){document.querySelectorAll('[data-k]').forEach(e=>S.wiz.d[e.dataset.k]=e.type=='checkbox'?e.checked:e.value)}
function adv(r,n,who){r.idx=n;r.tl.push({d:now(),ev:ST[n],who:who||WHO[n]});S.notes.unshift(`${r.id}: ${ST[n]}.`)}
document.addEventListener('click',e=>{
const g=e.target.closest('[data-go]');if(g){if(g.dataset.go=='request'){newReq();if(g.dataset.cat){S.wiz.d.cat=g.dataset.cat;S.wiz.step=1}}$('#links').classList.remove('open');go(g.dataset.go,g.dataset.sec);return}
const tb=e.target.closest('[data-tab]');if(tb){const k=location.hash.slice(1);S.tab[k]=tb.dataset.tab;S.sel=null;S.q='';S.f='All';if(tb.dataset.tab=='Create New Request'){newReq();return go('request')}route();return}
const o=e.target.closest('[data-open]');if(o){S.sel=o.dataset.open;route();scrollTo(0,0);return}
const a=e.target.closest('[data-act]');if(!a)return;const x=a.dataset.act,v=a.dataset.v,r=v&&R(v);
if(x=='menu')$('#links').classList.toggle('open');
else if(x=='cat'){S.wiz.d.cat=v;route()}
else if(x=='next'){collect();const er=VAL[S.wiz.step](S.wiz.d);S.wiz.err=Object.keys(er).length?er:null;if(S.wiz.err)toast(Object.values(er)[0],'err');else S.wiz.step++;route()}
else if(x=='back'){collect();S.wiz.err=null;S.wiz.step--;route()}
else if(x=='submit'){collect();const w=S.wiz,d=w.d,er=VAL[4](d);if(Object.keys(er).length){w.err=er;toast('Please confirm all four statements.','err');return route()}
const id='JG-'+(Math.max(1000,...S.reqs.map(r=>+r.id.slice(3)))+1);S.reqs.unshift({id,svc:esc(d.title),cat:d.cat,city:d.city||PILOT,idx:0,cust:esc(d.name)+' ('+esc(d.country)+')',rep:null,amt:0,off:0,cour:0,pay:'Not processed (demo)',qs:'Not prepared',date:new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),mine:1,loc:esc(d.inst)||'—',desc:esc(d.task),tl:[{d:now(),ev:'Request Submitted',who:'Customer'}]});S.notes.unshift(id+': request received.');S.done=id;S.wiz={step:0,d:{},files:[],err:null};toast('Request submitted (demo).');route()}
else if(x=='reset'){Object.assign(S,JSON.parse(SEED));newReq();S.sel=null;toast('Demo data reset.');route()}
else if(x=='closeSel'){S.sel=null;route()}
else if(x=='approveQ'){r.qs='Approved';adv(r,3,'Customer');toast('Quotation approved. Payment is a separate step and is not recorded.');route()}
else if(x=='revQ'){r.qs='Revision requested';adv(r,1,'Customer');toast('Revision requested.');route()}
else if(x=='rejQ'){r.qs='Rejected';r.tl.push({d:now(),ev:'Quotation rejected',who:'Customer'});S.notes.unshift(r.id+': quotation rejected.');toast('Quotation rejected.','err');route()}
else if(x=='review'){adv(r,1,'Jugaro Operations');toast('Marked under review.');route()}
else if(x=='override'){const why=$('#ovr').value.trim(),n=+$('#ovs').value;if(!why)return toast('Enter a reason for the override.','err');adv(r,n,'Admin override');r.tl.push({d:now(),ev:'ADMIN OVERRIDE: '+why,who:'Jugaro Operations'});toast('Override recorded in history.');route()}
else if(x=='confirm'||x=='appr'){if(!(r.sub&&(r.ev||[]).length))return toast('A representative must upload evidence and submit it for review first.','err');adv(r,7,x=='confirm'?'Customer':'Jugaro Operations');toast('Marked as completed.');route()}
else if(x=='quote'){r.amt=+$('#qa').value||0;r.qs='Awaiting your decision';if(r.idx<2)adv(r,2,'Jugaro Operations');else r.tl.push({d:now(),ev:'Quotation updated',who:'Jugaro Operations'});toast('Quotation sent to customer.');route()}
else if(x=='refund'){r.pay='Refund workflow started';toast('Refund workflow started for '+r.id);route()}
else if(x=='rs'){if(a.dataset.n=='6c'){r.sub=1;r.tl.push({d:now(),ev:'Submitted for customer review',who:'Representative'});S.notes.unshift(r.id+': submitted for customer review.');toast('Submitted for customer review.')}else adv(r,+a.dataset.n,'Representative');route()}
else if(x=='ev'){r.ev=['Photo (simulated)','Receipt (simulated)'];adv(r,6,'Representative');toast('Evidence uploaded (demo).');route()}
else if(x=='take'){r.rep=ME;adv(r,4,'Representative');toast('Task accepted.');route()}
else if(x=='up2')toast('Attachment placeholder: nothing is stored in this demo.');
});
document.addEventListener('input',e=>{if(e.target.dataset.act=='q'){S.q=e.target.value;const p=e.target.selectionStart;route();const i=document.querySelector('[data-act=q]');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act=='f'){S.f=t.value;route()}
if(t.dataset.adm=='rep'&&t.value){const r=R(t.dataset.v);r.rep=t.value;if(r.idx<4)adv(r,4,'Jugaro Operations');toast('Representative assigned.');route()}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.act!='files')return;const w=S.wiz;collect();w.files=[];w.ferr=[];[...t.files].slice(0,5).forEach(f=>{if(!/\.(pdf|jpe?g|png)$/i.test(f.name))w.ferr.push(f.name+': only PDF, JPG or PNG allowed.');else if(f.size>5*1048576)w.ferr.push(f.name+': larger than 5 MB.');else w.files.push({n:f.name,s:Math.round(f.size/1024)})});if(t.files.length>5)w.ferr.push('Maximum 5 files; extra files ignored.');route()});
addEventListener('hashchange',route);route();
</script></body></html>
